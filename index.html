<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭公布欄 3D 河道示意</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面:上方工具列,下方整塊是 3D 軟木塞板河道;打開的主題是疊在板子上的紙張面板 */
:root{
  --wall:#E6D7BC;
  --ink:#3A2E25;
  --ink-soft:#5E4E41;
  --paper:#FFFBF2;
  --accent:#8A3220;
  --rule:#B9A683;
  --font-display:"LXGW WenKai TC","Noto Sans TC",sans-serif;
  --font-body:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 20px 12px}
h1{margin:0;font-family:var(--font-display);font-size:28px;line-height:1.2}
.who{font-size:13px;color:var(--ink-soft)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tags button{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:22px;background:var(--paper)}
.tags button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
#stage{position:relative;flex:1 1 auto;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#gl.hover{cursor:pointer}
.bar{position:absolute;left:16px;top:8px;display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--ink);border-radius:26px;padding:4px 14px 4px 4px;max-width:calc(100% - 32px)}
.bar button{width:44px;height:44px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;line-height:1}
.bar span{font-size:13px}
#panel{opacity:.995;position:absolute;top:16px;right:16px;bottom:16px;width:380px;max-width:calc(100% - 32px);background:var(--paper);border-radius:12px;box-shadow:0 12px 30px rgba(58,46,37,.35);padding:16px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#panel>*{flex:none}
#panel[hidden]{display:none}
#panel h2{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.25;text-wrap:balance}
#panel h3{margin:0;font-size:13px}
#panel p{margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{align-self:flex-start;font-size:12px;font-weight:700;padding:1px 10px;border:1.5px solid var(--ink);border-radius:12px}
.close{min-height:44px;padding:0 12px;border:0;background:transparent;font-weight:700}
.meta{font-size:13px;color:var(--ink-soft)}
.due{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;border:1.5px solid var(--ink)}
.due.soon{background:var(--accent);border-color:var(--accent);color:#fff}
.ack{flex:none;min-height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:8px;background:#FFF1B8;font-weight:700}
.ack:disabled{background:transparent;border-style:dashed;cursor:default}
.sec{border-top:2px dashed var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.log{margin:0;padding:0 0 0 12px;list-style:none;border-left:2px solid var(--ink);font-size:13px;display:flex;flex-direction:column;gap:4px}
.log span{color:var(--ink-soft)}
.cm{padding:8px 10px;border-radius:3px}
form{display:flex;gap:8px}
form input{flex:1 1 auto;min-width:0;min-height:44px;padding:0 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;font:inherit;color:var(--ink)}
form button{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700}
.note{font-size:12px;color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#nogl[hidden]{display:none}
@media (max-width:719px){
  header{padding:12px 16px 10px}
  h1{font-size:24px}
  .tags{margin-left:0;flex-wrap:nowrap;overflow-x:auto;width:100%}
  .tags button{flex:none}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-width:none;height:56%}
  .bar span{display:none}
  .bar{padding:4px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>我們家的公布欄</h1>
    <div class="who">示範資料 · 目前身分:爸 · 重新整理會還原</div>
  </div>
  <div class="tags" id="tags" role="group" aria-label="分類標籤"></div>
</header>
<div id="stage">
  <canvas id="gl" aria-label="3D 公布欄河道。拖曳或用下方按鈕左右移動,點便利貼打開主題。"></canvas>
  <div id="nogl" hidden>這個裝置無法顯示 3D 畫面(WebGL 沒有啟用)。</div>
  <div class="bar">
    <button type="button" id="prev" aria-label="上一個主題(較新)">&#8249;</button>
    <button type="button" id="next" aria-label="下一個主題(較早)">&#8250;</button>
    <span>拖曳板子左右移動,點便利貼打開</span>
  </div>
  <section id="panel" hidden aria-label="打開的主題"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var TAGS={'行程':'#D5E6F2','採買':'#FFF1B8','家事':'#D9EBCB','公告':'#FBD9D3','寵物':'#FFFBF2'};
var MEMBERS=['爸','媽','姊','弟','阿嬤'];
var ME='爸';
var COLS=['今天 下午','今天 上午','昨天 11/23 (一)','11/22 (日)','11/21 (六)','11/20 (五)','11/19 (四)'];
var topics=[
 {col:0,tag:'公告',title:'週四晚上停水',author:'媽',time:'今天 14:20',body:'社區公告:11/26 (四) 22:00 到隔天 06:00 停水,記得先儲水、先洗澡。',due:{days:2,label:'11/26 (四)'},read:['媽','姊'],comments:[['姊','我那天晚自習,會先洗好再出門。'],['媽','爸記得把陽台的水桶裝滿。']]},
 {col:0,tag:'採買',title:'週末大賣場採買清單',author:'爸',time:'今天 13:40',body:'衛生紙、洗衣精、貓砂,還缺什麼在下面留言。',comments:[['媽','醬油快用完了。'],['弟','我要洋芋片。'],['阿嬤','幫我帶一包冬粉。']]},
 {col:1,tag:'家事',title:'繳水費',author:'媽',time:'今天 09:05',body:'帳單在鞋櫃上,誰路過超商順便繳。',due:{days:3,label:'11/27 (五)'},comments:[['姊','我明天放學去繳。']]},
 {col:2,tag:'行程',title:'週六回阿嬤家吃飯',author:'爸',time:'昨天 20:10',body:'11/28 (六) 中午出發,晚餐後回來。',due:{days:4,label:'11/28 (六)'},read:['爸','媽','阿嬤'],comments:[]},
 {col:2,tag:'公告',title:'冰箱的蛋糕是弟弟的',author:'弟',time:'昨天 17:30',body:'上面有貼名字,不要吃。',read:['爸','媽','姊','弟','阿嬤'],comments:[['姊','知道了啦。']]},
 {col:3,tag:'寵物',title:'貓咪打預防針',author:'姊',time:'11/22 15:00',body:'12/1 (二) 晚上帶去動物醫院,記得帶健康手冊。',due:{days:7,label:'12/1 (二)'},comments:[['媽','我下班可以載。']]},
 {col:4,tag:'行程',title:'寒假要去哪裡玩?',author:'姊',time:'11/21 21:15',body:'大家先丟想去的地方,月底前決定。',comments:[['弟','想去滑雪。'],['媽','阿嬤想泡溫泉。'],['爸','先看預算。']]},
 {col:5,tag:'家事',title:'換浴室燈泡',author:'爸',time:'11/20 19:40',body:'二樓浴室的燈會閃,新燈泡買好放在工具箱。',comments:[['爸','已經換好了。']]},
 {col:6,tag:'採買',title:'阿嬤生日禮物',author:'媽',time:'11/19 12:10',body:'12/5 (六) 生日,大家想一下要送什麼。',due:{days:11,label:'12/5 (六)'},comments:[]}
];
topics.forEach(function(t,i){
  t.id=i;
  t.records=[[t.time,t.author+' 貼出主題']];
  if(t.due) t.records.push([t.time,t.author+' 設定到期日 '+t.due.label]);
  if(t.read){ t.records.push([t.time,t.author+' 開啟全家已讀確認']); t.read.forEach(function(m){ if(m!==t.author) t.records.push(['之後',m+' 按了「知道了」']); }); }
});

var stage=document.getElementById('stage'), canvas=document.getElementById('gl'), panel=document.getElementById('panel');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var FD='"LXGW WenKai TC","Noto Sans TC",sans-serif', FB='"Noto Sans TC",system-ui,sans-serif';

/* ---------- 便利貼貼圖 ---------- */
var TW=640, PAD=44, CARD_W=2.6;
function wrap(ctx,text,maxW,maxLines){
  var lines=[],cur='';
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(ctx.measureText(cur+ch).width>maxW && cur && '。,、!?…)」'.indexOf(ch)<0){ lines.push(cur); cur=ch; } else cur+=ch;
  }
  if(cur) lines.push(cur);
  if(maxLines && lines.length>maxLines){ lines=lines.slice(0,maxLines); var l=lines[maxLines-1]; lines[maxLines-1]=l.slice(0,l.length-1)+'…'; }
  return lines;
}
function footText(t){
  var parts=[];
  if(t.read) parts.push(t.read.length===MEMBERS.length?'全家都看過了':'已讀 '+t.read.length+'/'+MEMBERS.length);
  parts.push(t.comments.length?'留言 '+t.comments.length:'還沒有留言');
  return parts.join(' · ');
}
function drawCard(t,cv){
  cv=cv||document.createElement('canvas');
  var ctx=cv.getContext('2d'), inner=TW-PAD*2;
  ctx.font='700 52px '+FD; var tl=wrap(ctx,t.title,inner,2);
  ctx.font='400 28px '+FB; var bl=wrap(ctx,t.body,inner,2);
  var H=56+44+18+tl.length*66+4+36+10+bl.length*40+(t.due?20+52:0)+20+36+34;
  cv.width=TW; cv.height=H; ctx=cv.getContext('2d');
  ctx.fillStyle=TAGS[t.tag]; ctx.fillRect(0,0,TW,H);
  var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(255,255,255,.25)'); g.addColorStop(1,'rgba(58,46,37,.08)');
  ctx.fillStyle=g; ctx.fillRect(0,0,TW,H);
  ctx.textBaseline='top'; ctx.fillStyle='#3A2E25'; ctx.strokeStyle='#3A2E25';
  var y=56;
  ctx.font='700 26px '+FB; var tw=ctx.measureText(t.tag).width+36;
  ctx.lineWidth=3; rr(ctx,PAD,y,tw,44,22); ctx.stroke(); ctx.fillText(t.tag,PAD+18,y+8);
  y+=44+18;
  ctx.font='700 52px '+FD; tl.forEach(function(l){ ctx.fillText(l,PAD,y+4); y+=66; });
  y+=4; ctx.font='400 26px '+FB; ctx.fillStyle='#5E4E41'; ctx.fillText(t.author+' · '+t.time,PAD,y); y+=36+10;
  ctx.fillStyle='#3A2E25'; ctx.font='400 28px '+FB; bl.forEach(function(l){ ctx.fillText(l,PAD,y); y+=40; });
  if(t.due){
    y+=20; ctx.font='700 26px '+FB; var txt='還有 '+t.due.days+' 天 · '+t.due.label, w=ctx.measureText(txt).width+70, soon=t.due.days<=3;
    rr(ctx,PAD,y,w,52,8); if(soon){ ctx.fillStyle='#8A3220'; ctx.fill(); } else { ctx.fillStyle='#FFFBF2'; ctx.fill(); ctx.lineWidth=3; ctx.stroke(); }
    var c=soon?'#FFFFFF':'#3A2E25'; ctx.strokeStyle=c; ctx.fillStyle=c; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(PAD+28,y+26,12,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD+28,y+18); ctx.lineTo(PAD+28,y+26); ctx.lineTo(PAD+34,y+30); ctx.stroke();
    ctx.fillText(txt,PAD+52,y+11); y+=52; ctx.fillStyle='#3A2E25'; ctx.strokeStyle='#3A2E25';
  }
  y+=20; ctx.font='500 26px '+FB; ctx.fillText(footText(t),PAD,y);
  return cv;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function labelCanvas(text){
  var cv=document.createElement('canvas'); cv.width=512; cv.height=96; var ctx=cv.getContext('2d');
  ctx.fillStyle='#FFFBF2'; rr(ctx,4,4,504,88,10); ctx.fill();
  ctx.fillStyle='#3A2E25'; ctx.font='700 40px '+FB; ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.fillText(text,256,50);
  return cv;
}
function corkCanvas(){
  var cv=document.createElement('canvas'); cv.width=cv.height=512; var ctx=cv.getContext('2d');
  ctx.fillStyle='#C9A56F'; ctx.fillRect(0,0,512,512);
  var s=7; function rnd(){ s=(s*16807)%2147483647; return s/2147483647; }
  for(var i=0;i<5200;i++){ var d=rnd(); ctx.fillStyle=d<.5?'rgba(110,74,36,'+(.12+rnd()*.25)+')':'rgba(240,214,170,'+(.12+rnd()*.25)+')'; var r=.6+rnd()*2.4; ctx.beginPath(); ctx.arc(rnd()*512,rnd()*512,r,0,6.3); ctx.fill(); }
  return cv;
}

/* ---------- 場景 ---------- */
var renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true}); }catch(e){ document.getElementById('nogl').hidden=false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene(); scene.background=new THREE.Color(0xE6D7BC);
var FOV=40, CAM_Z=10.4, camera=new THREE.PerspectiveCamera(FOV,1,.1,100); camera.position.set(0,0,CAM_Z);
var COL_GAP=3.3, LEFT=-2.4, RIGHT=(COLS.length-1)*COL_GAP+2.4, BOARD_H=7.4;
scene.add(new THREE.HemisphereLight(0xFFF6E6,0x9A7A55,.85));
var sun=new THREE.DirectionalLight(0xFFE9C8,.65); sun.position.set((LEFT+RIGHT)/2-7,9,12); sun.target.position.set((LEFT+RIGHT)/2,0,0);
sun.castShadow=true; sun.shadow.mapSize.set(4096,1024);
var sc=sun.shadow.camera; sc.left=-(RIGHT-LEFT)/2-3; sc.right=(RIGHT-LEFT)/2+3; sc.top=6; sc.bottom=-6; sc.near=1; sc.far=40; sun.shadow.bias=-.0006; sun.shadow.radius=4;
scene.add(sun); scene.add(sun.target);

var corkTex=new THREE.CanvasTexture(corkCanvas()); corkTex.wrapS=corkTex.wrapT=THREE.RepeatWrapping; corkTex.repeat.set((RIGHT-LEFT)/3.5,BOARD_H/3.5); corkTex.encoding=THREE.sRGBEncoding;
var board=new THREE.Mesh(new THREE.PlaneGeometry(RIGHT-LEFT,BOARD_H),new THREE.MeshStandardMaterial({map:corkTex,roughness:1}));
board.position.set((LEFT+RIGHT)/2,0,0); board.receiveShadow=true; scene.add(board);
var wood=new THREE.MeshStandardMaterial({color:0x7A5230,roughness:.8});
[[BOARD_H/2+.15,.3],[-BOARD_H/2-.15,.3]].forEach(function(a){ var m=new THREE.Mesh(new THREE.BoxGeometry(RIGHT-LEFT+.6,a[1],.35),wood); m.position.set((LEFT+RIGHT)/2,a[0],.1); m.castShadow=true; scene.add(m); });
[LEFT-.15,RIGHT+.15].forEach(function(x){ var m=new THREE.Mesh(new THREE.BoxGeometry(.3,BOARD_H,.35),wood); m.position.set(x,0,.1); scene.add(m); });
/* 時間軸:板子下緣的木條與時間標籤 */
var ledge=new THREE.Mesh(new THREE.BoxGeometry(RIGHT-LEFT,.12,.28),wood); ledge.position.set((LEFT+RIGHT)/2,-3.02,.14); ledge.castShadow=true; ledge.receiveShadow=true; scene.add(ledge);
var labelMats=[];
COLS.forEach(function(text,i){
  var tex=new THREE.CanvasTexture(labelCanvas(text)); tex.encoding=THREE.sRGBEncoding; labelMats.push({tex:tex,text:text});
  var m=new THREE.Mesh(new THREE.PlaneGeometry(2.1,.39),new THREE.MeshStandardMaterial({map:tex,roughness:.9}));
  m.position.set(i*COL_GAP,-3.38,.06); m.castShadow=true; scene.add(m);
  var tick=new THREE.Mesh(new THREE.BoxGeometry(.05,.3,.05),wood); tick.position.set(i*COL_GAP,-2.86,.05); scene.add(tick);
});

/* 便利貼 */
var aniso=renderer.capabilities.getMaxAnisotropy(), cards=[], meshes=[];
var pinGeo=new THREE.SphereGeometry(.075,16,12), pinMat=new THREE.MeshStandardMaterial({color:0x8A3220,roughness:.35});
var colY={};
topics.forEach(function(t,i){
  var cv=drawCard(t), tex=new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=aniso;
  var h=cv.height/TW*CARD_W, geo=new THREE.PlaneGeometry(CARD_W,h,1,14), p=geo.attributes.position;
  for(var k=0;k<p.count;k++){ var u=(h/2-p.getY(k))/h; p.setZ(k,.02+.16*u*u); }
  geo.computeVertexNormals();
  var mat=new THREE.MeshStandardMaterial({map:tex,roughness:.92,side:THREE.DoubleSide,transparent:true});
  var mesh=new THREE.Mesh(geo,mat); mesh.position.y=-h/2+.12; mesh.castShadow=true; mesh.receiveShadow=true;
  var pin=new THREE.Mesh(pinGeo,pinMat); pin.position.set(0,0,.1); pin.castShadow=true;
  var group=new THREE.Group(); group.add(mesh); group.add(pin);
  var single=topics.filter(function(o){return o.col===t.col;}).length===1;
  var top=colY[t.col]===undefined?(single?[2.5,3.0,1.9,2.7][t.col%4]:3.05):colY[t.col];
  colY[t.col]=top-h-.4;
  var tilt=((i*37)%7-3)*.008;
  var home=new THREE.Vector3(t.col*COL_GAP+((i%2)?.12:-.1),top,.02);
  group.position.copy(home); group.rotation.z=tilt; scene.add(group);
  mesh.userData.card=cards.length; meshes.push(mesh);
  cards.push({t:t,group:group,mesh:mesh,mat:mat,tex:tex,cv:cv,h:h,home:home,tilt:tilt,phase:i*1.7,lift:0,sel:0,dim:1});
});

/* 字型載入後重畫貼圖 */
if(document.fonts&&document.fonts.load){
  var all=topics.map(function(t){return t.tag+t.title+t.author+t.time+t.body+(t.due?t.due.label:'');}).join('')+COLS.join('')+'還有天已讀留言全家都看過了沒0123456789/·…';
  Promise.all([document.fonts.load('700 52px "LXGW WenKai TC"',all),document.fonts.load('400 28px "Noto Sans TC"',all),document.fonts.load('500 28px "Noto Sans TC"',all),document.fonts.load('700 28px "Noto Sans TC"',all)]).then(function(){
    cards.forEach(function(c){ drawCard(c.t,c.cv); c.tex.needsUpdate=true; });
    labelMats.forEach(function(l){ l.tex.image=labelCanvas(l.text); l.tex.needsUpdate=true; });
  }).catch(function(){});
}

/* ---------- 互動 ---------- */
var W=1,H=1,narrow=false,camX=0,targetX=0,vel=0,minX=0,maxX=0,ptr={x:0,y:0},hover=-1,selected=-1,filter=null;
function visH(){ return 2*CAM_Z*Math.tan(FOV*Math.PI/360); }
function resize(){
  W=stage.clientWidth; H=stage.clientHeight; narrow=W<720;
  renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix();
  var half=visH()*camera.aspect/2; minX=LEFT-.6+half; maxX=RIGHT+.6-half;
  if(minX>maxX) minX=maxX=(LEFT+RIGHT)/2;
  targetX=clamp(targetX);
}
function clamp(x){ return Math.max(minX,Math.min(maxX,x)); }
window.addEventListener('resize',resize); resize(); camX=targetX=clamp(0);

var ray=new THREE.Raycaster(), v2=new THREE.Vector2();
function pick(e){
  var r=canvas.getBoundingClientRect(); v2.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));
  ray.setFromCamera(v2,camera); var hit=ray.intersectObjects(meshes,false);
  for(var i=0;i<hit.length;i++){ var c=hit[i].object.userData.card; if(cards[c].dim>.5||c===selected) return c; }
  return -1;
}
var drag=null;
canvas.addEventListener('pointerdown',function(e){ drag={x:e.clientX,sx:e.clientX,moved:false,t:performance.now()}; vel=0; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); });
canvas.addEventListener('pointermove',function(e){
  var r=canvas.getBoundingClientRect(); ptr.x=(e.clientX-r.left)/r.width*2-1; ptr.y=(e.clientY-r.top)/r.height*2-1;
  if(drag){
    var dx=e.clientX-drag.x; drag.x=e.clientX; if(Math.abs(e.clientX-drag.sx)>6) drag.moved=true;
    var d=-dx*visH()/H; targetX=clamp(targetX+d); vel=d;
  } else if(e.pointerType==='mouse'){ hover=pick(e); canvas.classList.toggle('hover',hover>=0); }
});
canvas.addEventListener('pointerup',function(e){
  canvas.classList.remove('dragging');
  if(drag&&!drag.moved){ var c=pick(e); if(c>=0) open(c); else if(selected>=0) close(); }
  else if(drag&&!reduce){ targetX=clamp(targetX+vel*10); }
  drag=null;
});
canvas.addEventListener('pointerleave',function(){ hover=-1; ptr.x=ptr.y=0; canvas.classList.remove('hover'); });
canvas.addEventListener('wheel',function(e){ e.preventDefault(); var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY; targetX=clamp(targetX+d*visH()/H); },{passive:false});
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1); else if(e.key==='Escape'&&selected>=0) close();
});
document.getElementById('prev').addEventListener('click',function(){ step(-1); });
document.getElementById('next').addEventListener('click',function(){ step(1); });
function visible(i){ return !filter||topics[i].tag===filter; }
function step(dir){
  var i=selected;
  for(var n=0;n<topics.length;n++){ i+=dir; if(i<0||i>=topics.length){ return; } if(visible(i)){ open(i,true); return; } }
}

/* 標籤篩選 */
var tagBox=document.getElementById('tags');
[null].concat(Object.keys(TAGS)).forEach(function(tag){
  var b=document.createElement('button'); b.type='button'; b.textContent=tag||'全部'; b.setAttribute('aria-pressed',tag===null?'true':'false');
  b.addEventListener('click',function(){
    filter=tag; Array.prototype.forEach.call(tagBox.children,function(x){ x.setAttribute('aria-pressed',x===b?'true':'false'); });
    if(selected>=0&&!visible(selected)) close();
  });
  tagBox.appendChild(b);
});

/* 打開的主題面板 */
function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function redraw(c){ drawCard(c.t,c.cv); c.tex.needsUpdate=true; }
function render(keepFocus){
  var c=cards[selected], t=c.t; panel.textContent='';
  var top=el('div','row'); var chip=el('span','chip',t.tag); chip.style.background=TAGS[t.tag]; top.appendChild(chip);
  var x=el('button','close','收起來'); x.type='button'; x.addEventListener('click',close); top.appendChild(x); panel.appendChild(top);
  panel.appendChild(el('h2',null,t.title)); panel.appendChild(el('p','meta',t.author+' · '+t.time)); panel.appendChild(el('p',null,t.body));
  if(t.due||t.read){
    var s=el('div','sec'); s.appendChild(el('h3',null,'這個主題的提醒'));
    if(t.due){ var d=el('span','due'+(t.due.days<=3?' soon':''),'到期日倒數:還有 '+t.due.days+' 天 · '+t.due.label); d.style.alignSelf='flex-start'; s.appendChild(d); }
    if(t.read){
      var row=el('div','row'), left=MEMBERS.filter(function(m){return t.read.indexOf(m)<0;});
      row.appendChild(el('span',null,'已讀 '+t.read.length+'/'+MEMBERS.length+(left.length?' · '+left.join('、')+'還沒看':' · 全家都看過了')));
      var done=t.read.indexOf(ME)>=0, a=el('button','ack',done?'你已經看過':'知道了'); a.type='button'; a.disabled=done;
      a.addEventListener('click',function(){ t.read.push(ME); t.records.push(['剛剛',ME+' 按了「知道了」']); redraw(c); render(); });
      row.appendChild(a); s.appendChild(row);
    }
    panel.appendChild(s);
  }
  var r=el('div','sec'); r.appendChild(el('h3',null,'記錄')); var ul=el('ul','log');
  t.records.forEach(function(x){ var li=el('li'); li.appendChild(el('span',null,x[0]+' ')); li.appendChild(document.createTextNode(x[1])); ul.appendChild(li); });
  r.appendChild(ul); panel.appendChild(r);
  var m=el('div','sec'); m.appendChild(el('h3',null,'留言 ('+t.comments.length+')'));
  t.comments.forEach(function(x){ var p=el('p','cm'); p.style.background=TAGS[['行程','公告','家事','採買'][MEMBERS.indexOf(x[0])%4]]; p.appendChild(el('strong',null,x[0]+' ')); p.appendChild(document.createTextNode(x[1])); m.appendChild(p); });
  var f=el('form'), lab=el('label','sr','留言內容'); lab.htmlFor='cm-input'; var inp=el('input'); inp.id='cm-input'; inp.type='text'; inp.placeholder='留一句…'; inp.autocomplete='off';
  var send=el('button',null,'送出'); send.type='submit'; f.appendChild(lab); f.appendChild(inp); f.appendChild(send);
  f.addEventListener('submit',function(e){ e.preventDefault(); var v=inp.value.trim(); if(!v) return; t.comments.push([ME,v]); t.records.push(['剛剛',ME+' 留言']); redraw(c); render(true); });
  m.appendChild(f); panel.appendChild(m);
  panel.appendChild(el('p','note','示範用:按鈕與留言只改變這個畫面,不會儲存。'));
  if(keepFocus) document.getElementById('cm-input').focus();
}
function open(i,focus){
  selected=i; hover=-1; panel.hidden=false; render(); panel.scrollTop=0;
  targetX=clamp(cards[i].home.x+(narrow?0:1.6));
  if(focus) panel.querySelector('.close').focus();
}
function close(){ selected=-1; panel.hidden=true; }

/* ---------- 動畫 ---------- */
var clock=new THREE.Clock(), tmp=new THREE.Vector3();
function frame(){
  var dt=Math.min(clock.getDelta(),.05), time=clock.elapsedTime, k=reduce?1:1-Math.exp(-dt*7);
  camX+=(targetX-camX)*k;
  var px=reduce?0:ptr.x, py=reduce?0:ptr.y;
  camera.position.set(camX+px*.35,-py*.2,CAM_Z); camera.rotation.set(py*.018,-px*.03,0);
  for(var i=0;i<cards.length;i++){
    var c=cards[i], isSel=i===selected, on=visible(i);
    c.sel+=((isSel?1:0)-c.sel)*k; c.lift+=((i===hover&&!isSel?1:0)-c.lift)*k; c.dim+=((on?1:.18)-c.dim)*k;
    if(narrow) tmp.set(camX,2.45,1.5); else tmp.set(camX-1.9,1.2,4.4);
    var s=c.sel, g=c.group;
    g.position.x=c.home.x+(tmp.x-c.home.x)*s;
    g.position.y=c.home.y+(tmp.y-c.home.y)*s;
    g.position.z=c.home.z+(tmp.z-c.home.z)*s+c.lift*.45;
    var sway=reduce?0:Math.sin(time*.9+c.phase)*.018;
    g.rotation.x=-(.02+sway+c.lift*.1)*(1-s);
    g.rotation.z=c.tilt*(1-s)+(reduce?0:Math.sin(time*.6+c.phase)*.006*(1-s));
    var sc2=1+c.lift*.04+s*(narrow?0:.12); g.scale.set(sc2,sc2,1);
    c.mat.opacity=c.dim; c.mesh.castShadow=c.dim>.5;
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
